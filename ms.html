<!doctype html>
<html lang="bn">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>M&S Premium Packaging</title>
<style>
:root{--ink:#17233b;--muted:#64748b;--line:#e5eaf2;--surface:#fff;--bg:#f4f6fb;--blue:#315ee8;--purple:#7047d7}*{box-sizing:border-box}body{margin:0;background:linear-gradient(145deg,#f2f6ff 0%,#f8f5ff 48%,#f4f8fc 100%);font-family:Arial,'Noto Sans Bengali',sans-serif;color:var(--ink);min-height:100vh}header{background:linear-gradient(110deg,#172554,#3730a3 55%,#6d28d9);color:#fff;padding:17px max(16px,calc((100vw - 1120px)/2));display:flex;align-items:center;justify-content:space-between;gap:12px;position:sticky;top:0;z-index:5;box-shadow:0 8px 24px #25256b25}header h1{font-size:clamp(16px,3vw,21px);margin:0;font-weight:800}button{border:0;border-radius:10px;padding:10px 13px;cursor:pointer;font-weight:700;font-size:13px;transition:.18s}button:active{transform:scale(.97)}.primary{background:linear-gradient(110deg,#315ee8,#7546d8);color:#fff;box-shadow:0 5px 14px #4f46e533}.secondary{background:#fff;color:#3730a3}.danger{background:#fff0f0;color:#b42318}.edit{background:#edf2ff;color:#344fc4}.wrap{max-width:1120px;margin:auto;padding:20px 16px}.tabs{display:flex;gap:8px;overflow-x:auto;padding:3px 1px 15px;scrollbar-width:thin}.tab{white-space:nowrap;background:#fff;color:#4b5875;border:1px solid #e4e8f2}.tab.active{background:linear-gradient(110deg,#315ee8,#7546d8);color:white;border-color:transparent;box-shadow:0 5px 14px #4f46e533}.grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:13px}.metric-card{border-radius:17px;padding:18px;color:white;min-height:112px;box-shadow:0 9px 24px #24345b16}.metric-card div{font-size:13px;opacity:.92}.metric-card strong{display:block;font-size:clamp(19px,3vw,27px);margin-top:13px;overflow-wrap:anywhere}.c1{background:linear-gradient(135deg,#0f9b8e,#087eaa)}.c2{background:linear-gradient(135deg,#4361ee,#6c4bd8)}.c3{background:linear-gradient(135deg,#f08a35,#e05a70)}.c4{background:linear-gradient(135deg,#53657d,#293d5c)}.card{background:#ffffffed;border:1px solid #e6eaf3;border-radius:17px;padding:18px;margin:0 0 15px;box-shadow:0 7px 24px #25365b0c}h2{font-size:21px;margin:5px 0 15px}h3{margin:0 0 13px;font-size:16px}.formgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(175px,1fr));gap:12px}label{display:block;font-size:13px;color:#43516d;font-weight:600}input,select,textarea{width:100%;padding:12px;border:1px solid #d7deeb;border-radius:10px;margin-top:6px;font:inherit;background:#fff;color:#17233b;min-width:0}input:focus{outline:2px solid #b8c7ff;border-color:#657eea}table{width:100%;border-collapse:collapse;min-width:560px}th,td{text-align:left;padding:12px 10px;border-bottom:1px solid var(--line);font-size:13px;vertical-align:middle}th{color:#53617b;background:#f5f7fc;white-space:nowrap}.tablewrap{overflow-x:auto;border-radius:10px}.empty{text-align:center;padding:28px;color:var(--muted)}.actions{display:flex;gap:6px;white-space:nowrap}.actions button{padding:7px 9px;font-size:11px}.notice{background:linear-gradient(110deg,#e9f1ff,#f2edff);border:1px solid #dce4ff;color:#34456e;border-radius:13px;padding:13px;font-size:13px;line-height:1.65;margin:15px 0}footer{text-align:center;color:#78849b;padding:22px;font-size:12px}.modal{display:none;position:fixed;inset:0;background:#101a35a6;z-index:20;padding:16px;align-items:center;justify-content:center}.modal.show{display:flex}.modal-box{width:min(560px,100%);max-height:90vh;overflow:auto;background:white;border-radius:18px;padding:20px;box-shadow:0 20px 70px #11182755}.modal-actions{display:flex;justify-content:flex-end;gap:8px;margin-top:18px}.muted{color:var(--muted);font-size:13px;line-height:1.6}@media(max-width:760px){.grid{grid-template-columns:repeat(2,minmax(0,1fr))}.wrap{padding:14px 11px}.card{padding:14px}.metric-card{padding:15px;min-height:100px}.tab{padding:10px 12px}}@media(max-width:380px){header{padding:12px}.grid{gap:9px}.metric-card{padding:12px}.metric-card strong{font-size:18px}}

/* M&S navy & gold responsive brand theme */
.brand{display:flex;align-items:center;gap:12px;min-width:0}.brand-logo{width:54px;height:54px;border-radius:50%;object-fit:cover;border:2px solid #d9a83c;box-shadow:0 3px 12px #0005}.head-actions{display:flex;gap:8px;align-items:center}header{background:linear-gradient(110deg,#061326 0%,#102b4b 55%,#9b6b16 140%);border-bottom:2px solid #c99a35}.primary,.tab.active{background:linear-gradient(110deg,#b77b19,#f0c75e 52%,#9b6817);color:#101c2e;box-shadow:0 5px 15px #b7832838}.metric-card.c1{background:linear-gradient(135deg,#0b3042,#167c79)}.metric-card.c2{background:linear-gradient(135deg,#102b4b,#b07b20)}.metric-card.c3{background:linear-gradient(135deg,#9b6817,#e5b84e)}.metric-card.c4{background:linear-gradient(135deg,#25364b,#071426)}.tab.active{border-color:#d6aa48}.watermark{display:block;font-size:10px;letter-spacing:1.3px;color:#a88749;margin-top:5px;opacity:.9}.dark{--ink:#edf2f8;--muted:#aab7c8;--line:#33445a;--surface:#14243a;--bg:#081426;background:linear-gradient(145deg,#071426,#10233a 55%,#172b42);color:var(--ink)}.dark .card,.dark .modal-box{background:#13253b;border-color:#31445b;color:#edf2f8}.dark label,.dark th{color:#d7e0ed}.dark input,.dark select,.dark textarea{background:#0b1b2e;color:#edf2f8;border-color:#40536a}.dark th{background:#1b3049}.dark .tab{background:#14263c;color:#d9e2ef;border-color:#344961}.dark .secondary{background:#263a52;color:#f6d98e}.dark .edit{background:#263b55;color:#f4d27c}.dark .danger{background:#4b2529;color:#ffd6d6}.dark .notice{background:linear-gradient(110deg,#1a3049,#342b24);border-color:#6c5832;color:#f0dfb5}.dark footer{color:#aab7c8}.dark .empty{color:#aab7c8}
@media(max-width:560px){header{padding:10px 11px;align-items:center}.brand{gap:8px}.brand-logo{width:42px;height:42px}.brand h1{font-size:15px;line-height:1.2}.head-actions{gap:5px}.head-actions button{padding:8px 9px;font-size:11px}.tabs{padding-bottom:10px}.tab{font-size:12px}}
</style></head>

function render(){ $('#langBtn').textContent=lang==='bn'?'English':'বাংলা';$('#themeBtn').textContent=theme==='dark'?'🌙 Dark':'☀️ Light';$('#tabs').innerHTML=nav.map(([k,ic])=>`<button class="tab ${tab===k?'active':''}" onclick="tab='${k}';render()">${ic} ${t(k)}</button>`).join('');let f={dash:dashboard,products:productsPage,sales:()=>transactionPage('sales'),purchases:()=>transactionPage('purchases'),expenses:expensesPage,settings:settingsPage,reports:reportsPage};$('#app').innerHTML=f[tab]();}
function dashboard(){let sale=db.sales.reduce((a,x)=>a+ +x.amount,0),buy=db.purchases.reduce((a,x)=>a+ +x.amount,0),exp=db.expenses.reduce((a,x)=>a+ +x.amount,0);return `<h2>${t('dash')}</h2><div class="grid"><div class="metric-card c1"><div>${t('stock')}</div><strong>${db.products.length}</strong></div><div class="metric-card c2"><div>${t('sale')}</div><strong>${money(sale)}</strong></div><div class="metric-card c3"><div>${t('buy')}</div><strong>${money(buy)}</strong></div><div class="metric-card c4"><div>${t('expense')}</div><strong>${money(exp)}</strong></div></div><div class="notice">🔒 ${t('local')}</div><section class="card"><h3>${lang==='bn'?'সাম্প্রতিক বিক্রি':'Recent Sales'}</h3>${db.sales.length?table(db.sales.slice(-5).map((x,i)=>({...x,_idx:db.sales.length-1-i})).reverse(),'sales'):`<div class="empty">${t('no')}</div>`}</section>`}
function productsPage(){return `<h2>${t('products')}</h2><section class="card"><h3>${t('addProduct')}</h3><form onsubmit="addProduct(event)"><div class="formgrid"><label>${t('name')}<input name="name" required></label><label>${t('sku')}<input name="sku"></label><label>${t('qty')}<input name="qty" type="number" min="0" value="0" required></label><label>${t('buyPrice')}<input name="buy" type="number" min="0" step=".01" value="0"></label><label>${t('sellPrice')}<input name="sell" type="number" min="0" step=".01" value="0"></label></div><p><button class="primary">＋ ${t('add')}</button></p></form></section><section class="card"><div class="tablewrap">${db.products.length?`<table><thead><tr><th>${t('name')}</th><th>${t('sku')}</th><th>${t('qty')}</th><th>${t('buyPrice')}</th><th>${t('sellPrice')}</th><th>${t('action')}</th></tr></thead><tbody>${db.products.map((p,i)=>`<tr><td>${safe(p.name)}</td><td>${safe(p.sku)}</td><td>${p.qty}</td><td>${money(p.buy)}</td><td>${money(p.sell)}</td><td><div class="actions"><button class="edit" onclick="editItem('products',${i})">✎ ${t('edit')}</button><button class="danger" onclick="removeItem('products',${i})">${t('delete')}</button></div></td></tr>`).join('')}</tbody></table>`:`<div class="empty">${t('no')}</div>`}</div></section>`}
function transactionPage(type){let title=type==='sales'?t('addSale'):t('addBuy');return `<h2>${t(type)}</h2><section class="card"><h3>${title}</h3><form onsubmit="addTransaction(event,'${type}')"><div class="formgrid"><label>${t('date')}<input name="date" type="date" value="${new Date().toISOString().slice(0,10)}" required></label><label>${t('person')}<input name="person"></label><label>${t('amount')}<input name="amount" type="number" min="0" step=".01" required></label><label>${t('note')}<input name="note"></label></div><p><button class="primary">＋ ${t('add')}</button></p></form></section><section class="card"><div class="tablewrap">${table(db[type],type)}</div></section>`}
function expensesPage(){return `<h2>${t('expenses')}</h2><section class="card"><h3>${t('addExpense')}</h3><form onsubmit="addTransaction(event,'expenses')"><div class="formgrid"><label>${t('date')}<input name="date" type="date" value="${new Date().toISOString().slice(0,10)}" required></label><label>${t('amount')}<input name="amount" type="number" min="0" step=".01" required></label><label>${t('note')}<input name="note"></label></div><p><button class="primary">＋ ${t('add')}</button></p></form></section><section class="card"><div class="tablewrap">${table(db.expenses,'expenses')}</div></section>`}
function table(arr,type){if(!arr.length)return `<div class="empty">${t('no')}</div>`;return `<table><thead><tr><th>${t('date')}</th><th>${type==='sales'||type==='purchases'?t('person'):t('note')}</th><th>${t('amount')}</th><th>${t('action')}</th></tr></thead><tbody>${arr.map((x,i)=>{let idx=x._idx??i;return `<tr><td>${safe(x.date)}</td><td>${safe(x.person||x.note||'—')}</td><td>${money(x.amount)}</td><td><div class="actions"><button class="edit" onclick="editItem('${type}',${idx})">✎ ${t('edit')}</button><button class="danger" onclick="removeItem('${type}',${idx})">${t('delete')}</button></div></td></tr>`}).join('')}</tbody></table>`}
function addProduct(e){e.preventDefault();let f=new FormData(e.target);db.products.push({name:f.get('name'),sku:f.get('sku'),qty:+f.get('qty'),buy:+f.get('buy'),sell:+f.get('sell')});persist();render();alert(t('success'))}
function addTransaction(e,type){e.preventDefault();let f=new FormData(e.target);db[type].push({date:f.get('date'),person:f.get('person')||'',note:f.get('note')||'',amount:+f.get('amount')});persist();render();alert(t('success'))}
function editItem(type,i){let x=db[type][i];if(!x)return;let fields=type==='products'?[['name',t('name'),'text'],['sku',t('sku'),'text'],['qty',t('qty'),'number'],['buy',t('buyPrice'),'number'],['sell',t('sellPrice'),'number']]:[['date',t('date'),'date'],...(type==='expenses'?[]:[['person',t('person'),'text']]),['amount',t('amount'),'number'],['note',t('note'),'text']];$('#modalTitle').textContent=t('editItem');$('#modalBody').innerHTML=`<form id="editForm" onsubmit="saveEdit(event,'${type}',${i})"><div class="formgrid">${fields.map(([key,label,inputType])=>`<label>${label}<input name="${key}" type="${inputType}" value="${safe(x[key]??'')}" ${key==='date'?'required':''}></label>`).join('')}</div><div class="modal-actions"><button type="button" class="secondary" onclick="closeModal()">${t('cancel')}</button><button class="primary">${t('save')}</button></div></form>`;$('#modal').classList.add('show')}
function saveEdit(e,type,i){e.preventDefault();let f=new FormData(e.target),x={...db[type][i]};for(let [k,v] of f.entries())x[k]=['qty','buy','sell','amount'].includes(k)?Number(v):v;db[type][i]=x;persist();closeModal();render();alert(t('success'))}
function closeModal(){$('#modal').classList.remove('show')}
function removeItem(type,i){if(confirm(t('confirm'))){db[type].splice(i,1);persist();render()}}
function reportsPage(){let month=new Date().toISOString().slice(0,7);return `<h2>${t('reportTitle')}</h2><section class="card"><div class="formgrid"><label>${t('reportMonth')}<input id="reportMonth" type="month" value="${month}"></label><label>${t('reportType')}<select id="reportType"><option value="both">${t('both')}</option><option value="sales">${t('salesOnly')}</option><option value="purchases">${t('purchasesOnly')}</option></select></label></div><p><button class="primary" onclick="downloadMonthlyPDF()">📄 ${t('makePdf')}</button></p><p class="muted">${t('reportNote')}</p><div id="reportPreview" class="notice">${lang==='bn'?'মাস ও রিপোর্টের ধরন নির্বাচন করে PDF তৈরি করুন।':'Choose a month and report type to create your PDF.'}</div></section>`}
function downloadMonthlyPDF(){let month=$('#reportMonth').value;if(!month){alert(lang==='bn'?'একটি মাস নির্বাচন করুন':'Please select a month');return;}let type=$('#reportType').value;let pick=arr=>arr.filter(x=>(x.date||'').slice(0,7)===month);let sales=type==='purchases'?[]:pick(db.sales), buys=type==='sales'?[]:pick(db.purchases);let sum=a=>a.reduce((n,x)=>n+(Number(x.amount)||0),0);let fmt=n=>'৳'+Number(n||0).toLocaleString('en-BD',{maximumFractionDigits:2});let title=lang==='bn'?'M&S Premium Packaging — মাসিক হিসাব':'M&S Premium Packaging — Monthly Report';let section=(label,arr)=>`<h2>${label}</h2><table><thead><tr><th>${lang==='bn'?'তারিখ':'Date'}</th><th>${lang==='bn'?'নাম / প্রতিষ্ঠান':'Name / Business'}</th><th>${lang==='bn'?'বিবরণ':'Description'}</th><th>${lang==='bn'?'টাকা':'Amount'}</th></tr></thead><tbody>${arr.length?arr.map(x=>`<tr><td>${safe(x.date)}</td><td>${safe(x.person||'—')}</td><td>${safe(x.note||'—')}</td><td>${fmt(x.amount)}</td></tr>`).join(''):`<tr><td colspan="4">${lang==='bn'?'কোনো তথ্য নেই':'No records'}</td></tr>`}</tbody><tfoot><tr><th colspan="3">${lang==='bn'?'মোট':'Total'}</th><th>${fmt(sum(arr))}</th></tr></tfoot></table>`;let html=`<!doctype html><html lang="${lang}"><head><meta charset="utf-8"><title>${title}</title><style>body{font-family:Arial,'Noto Sans Bengali',sans-serif;padding:28px;color:#17233b}h1{color:#9b6b16}h2{font-size:18px;margin-top:28px}p{color:#64748b}table{width:100%;border-collapse:collapse;margin-top:12px}th,td{border:1px solid #d8dee9;padding:9px;text-align:left;font-size:12px}thead th{background:#f3e8c8}tfoot th{background:#fff5dc}.sum{font-size:18px;font-weight:bold;margin-top:20px}@media print{button{display:none}}</style></head><body><h1>${title}</h1><p>${lang==='bn'?'রিপোর্টের মাস':'Report month'}: ${month}</p>${buys.length||type==='purchases'?section(lang==='bn'?'ক্রয়ের হিসাব':'Purchases',buys):''}${sales.length||type==='sales'?section(lang==='bn'?'বিক্রয়ের হিসাব':'Sales',sales):''}<p class="sum">${lang==='bn'?'ক্রয় মোট':'Purchases total'}: ${fmt(sum(buys))} &nbsp; | &nbsp; ${lang==='bn'?'বিক্রি মোট':'Sales total'}: ${fmt(sum(sales))}</p><p>${lang==='bn'?'তৈরি করেছেন: Munir':'Created by: Munir'}</p><script>window.onload=()=>setTimeout(()=>window.print(),350)<\/script></body></html>`;let w=window.open('','_blank');if(!w){alert(lang==='bn'?'পপ-আপ অনুমতি দিন, তারপর আবার চেষ্টা করুন।':'Allow pop-ups and try again.');return;}w.document.open();w.document.write(html);w.document.close();}
function settingsPage(){return `<h2>${t('settings')}</h2><section class="card"><p>${t('local')}</p><p class="muted">${t('backupHint')}</p><button class="primary" onclick="downloadBackup()">⬇ ${t('backup')}</button><p style="margin-top:18px"><label>${t('restore')}<input type="file" accept="application/json,.json" onchange="restoreBackup(event)"></label></p></section><section class="card"><h3>${lang==='bn'?'সতর্কতা':'Warning'}</h3><button class="danger" onclick="clearData()">${t('clear')}</button></section>`}
function downloadBackup(){let a=document.createElement('a'),url=URL.createObjectURL(new Blob([JSON.stringify(db,null,2)],{type:'application/json'}));a.href=url;a.download='ms-premium-packaging-backup-'+new Date().toISOString().slice(0,10)+'.json';a.click();setTimeout(()=>URL.revokeObjectURL(url),1500)}
function restoreBackup(e){let file=e.target.files[0];if(!file)return;let r=new FileReader();r.onload=()=>{try{let x=JSON.parse(r.result);for(const k of ['products','sales','purchases','expenses'])if(!Array.isArray(x[k]))throw Error();db=x;persist();render();alert(t('success'))}catch(_){alert('Invalid backup file')}};r.readAsText(file)}
function clearData(){if(confirm(t('confirm'))){db={products:[],sales:[],purchases:[],expenses:[]};persist();render()}}
function safe(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
render();

</script></body></html>
